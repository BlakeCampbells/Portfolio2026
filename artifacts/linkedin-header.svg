<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Blake Campbell LinkedIn header</title>
  <desc id="desc">A geometric banner inspired by Blake Campbell's portfolio, with bold black grid lines, warm paper, primary-color panels, and a frontend engineering message.</desc>
  <rect width="1584" height="396" fill="#111111"/>

  <!-- Decorative left section leaves room for LinkedIn's overlapping profile photo. -->
  <rect x="12" y="12" width="143" height="81" fill="#f3c623"/>
  <rect x="167" y="12" width="245" height="81" fill="#f7f4ef"/>
  <rect x="12" y="105" width="143" height="135" fill="#1f54c7"/>
  <rect x="167" y="105" width="245" height="135" fill="#d72d2d"/>
  <rect x="12" y="252" width="281" height="132" fill="#f7f4ef"/>
  <rect x="305" y="252" width="107" height="132" fill="#f3c623"/>

  <!-- Content panel. -->
  <rect x="424" y="12" width="842" height="372" fill="#f7f4ef"/>
  <rect x="474" y="102" width="18" height="28" fill="#d72d2d"/>
  <text x="474" y="199" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#111111">BLAKE CAMPBELL</text>
  <text x="477" y="253" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111111">SENIOR SOFTWARE ENGINEER</text>
  <rect x="476" y="291" width="77" height="8" fill="#d72d2d"/>
  <rect x="553" y="291" width="77" height="8" fill="#1f54c7"/>
  <rect x="630" y="291" width="77" height="8" fill="#f3c623"/>

  <!-- Primary-color edge echoes the portfolio's tiled navigation. -->
  <rect x="1278" y="12" width="294" height="137" fill="#d72d2d"/>
  <rect x="1278" y="161" width="144" height="223" fill="#f3c623"/>
  <rect x="1434" y="161" width="138" height="223" fill="#1f54c7"/>
</svg>
